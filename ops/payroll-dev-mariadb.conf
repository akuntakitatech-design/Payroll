[program:payroll-dev-mariadb]
command=/usr/sbin/mariadbd --defaults-file=/app/ops/mariadb-dev.cnf --user=mysql
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/app/.local-data/mariadb/supervisor.out.log
stderr_logfile=/app/.local-data/mariadb/supervisor.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
